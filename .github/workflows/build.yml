name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} / ${{ matrix.sklearn-label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            sklearn: "scikit-learn==1.7.*"
            sklearn-label: "sklearn 1.7"
          - python-version: "3.12"
            sklearn: "scikit-learn"
            sklearn-label: "current sklearn"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install ".[test]" "${{ matrix.sklearn }}"
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build a binary wheel and a source tarball
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/randalo-wheel-test
          /tmp/randalo-wheel-test/bin/python -m pip install dist/*.whl
      - name: Import the installed wheel without CVXPY
        working-directory: /tmp
        run: /tmp/randalo-wheel-test/bin/python -c "import randalo; print(randalo.__file__)"
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/randalo
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
